[project]
name = "easy-pi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai[openai]>=0.1.0",
    "pydantic-ai[web]>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.28.0",
]

[project.scripts]
travel-assistant = "src.app:main"
