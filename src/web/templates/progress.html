<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在规划中 - 旅游助手</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-50 min-h-screen">
    <nav class="bg-white/80 backdrop-blur border-b border-blue-100">
        <div class="max-w-2xl mx-auto px-6 py-4">
            <a href="/" class="text-xl font-bold text-blue-600">🌍 旅游助手</a>
        </div>
    </nav>

    <main class="max-w-2xl mx-auto px-6 py-12">

        <!-- 规划中 -->
        <div id="main-card" class="bg-white rounded-2xl shadow-lg p-8 text-center">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">
                正在为你规划 <span class="text-blue-600">{{ destination }}</span> 之旅
            </h1>
            <p class="text-gray-500 mb-8">{{ days }} 天行程 · ¥{{ "%.0f"|format(budget) }} 预算</p>

            <div class="w-full bg-gray-100 rounded-full h-3 mb-8 overflow-hidden">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-blue-400 to-blue-600 rounded-full transition-all duration-700 ease-out" style="width: 0%"></div>
            </div>

            <div id="status-area" class="min-h-[120px] flex flex-col items-center justify-center">
                <div id="stage-icon" class="text-5xl mb-4">🌏</div>
                <p id="stage-message" class="text-lg text-gray-700 font-medium">准备就绪，即将开始规划…</p>
                <p id="soothing-text" class="text-sm text-gray-400 mt-3 italic">好的规划值得耐心等待 ✨</p>
            </div>

            <div id="stage-log" class="mt-8 text-left space-y-2 max-h-[200px] overflow-y-auto"></div>
        </div>

        <!-- 完成 -->
        <div id="done-card" class="hidden bg-gradient-to-br from-green-50 to-emerald-50 rounded-2xl shadow-lg p-12 text-center border-2 border-green-300 mt-6">
            <div class="text-7xl mb-6 animate-bounce">✅</div>
            <h2 class="text-3xl font-bold text-green-700 mb-3">行程规划完成！</h2>
            <p class="text-green-600 text-lg">正在跳转到行程详情页…</p>
            <div class="mt-6 w-16 h-16 mx-auto">
                <div class="w-16 h-16 border-4 border-green-300 border-t-green-600 rounded-full animate-spin"></div>
            </div>
        </div>

        <!-- 失败 -->
        <div id="fail-card" class="hidden bg-gradient-to-br from-red-50 to-orange-50 rounded-2xl shadow-lg p-12 text-center border-2 border-red-300 mt-6">
            <div class="text-7xl mb-6">😵</div>
            <h2 class="text-2xl font-bold text-red-700 mb-3">规划遇到问题</h2>
            <p id="fail-message" class="text-red-600 mb-8">请稍后重试</p>
            <div class="flex gap-4 justify-center">
                <a href="/" class="bg-gray-200 text-gray-700 px-6 py-3 rounded-lg font-medium hover:bg-gray-300 transition">
                    返回首页
                </a>
                <button onclick="retryPlan()" class="bg-red-500 text-white px-6 py-3 rounded-lg font-medium hover:bg-red-600 transition shadow-md">
                    重新规划
                </button>
            </div>
        </div>

    </main>

    <style>
        @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-15px)} }
        .animate-bounce { animation: bounce 0.8s ease-in-out infinite; }
    </style>

    <script>
        const planId = "{{ plan_id }}";
        const destination = "{{ destination }}";
        const days = {{ days }};
        const budget = {{ budget }};
        const interests = "{{ interests }}";

        const stages = {
            guide:     { icon: "🌏", label: "导游规划路线" },
            foodie:    { icon: "🍜", label: "美食家推荐美食" },
            local:     { icon: "🏘️", label: "本地通挖掘宝藏" },
            finance:   { icon: "💰", label: "财务官精打细算" },
            synthesizing: { icon: "🧠", label: "主持人综合整理" },
        };

        const soothing = [
            "好的规划值得耐心等待 ✨",
            "几位旅行专家正在热烈讨论中…",
            "深呼吸，美好的旅程即将呈现 🌿",
            "导游正在翻阅当地攻略…",
            "美食家正在流连于各大食肆之间 😋",
            "本地通发现了几个小众秘境 🤫",
            "财务官正在帮你省钱 💪",
            "马上就好，再等一下下…",
        ];

        const logContainer = document.getElementById("stage-log");
        let soothingIdx = 0;
        let done = false;

        // 空闲超时：LLM 正在思考时不打断，但 30 秒无进度给个温柔提示
        let stallWarnTimer = setTimeout(() => {
            if (!done) {
                document.getElementById("stage-message").textContent = "规划耗时较长，请耐心等待…";
                document.getElementById("soothing-text").textContent = "有时候好的行程需要更多思考 🤔";
            }
        }, 30000);

        // 空闲超时：120 秒无任何进度才判定为真的超时
        // 注意：只要后端持续推进度事件，这个计时器就会不断重置
        let stallFailTimer = setTimeout(() => {
            if (!done) {
                evtSource.close();
                showFail("LLM 响应超时（120 秒无响应），请重试");
            }
        }, 120000);

        function resetStallTimers() {
            clearTimeout(stallWarnTimer);
            clearTimeout(stallFailTimer);
            if (done) return;
            stallWarnTimer = setTimeout(() => {
                if (!done) {
                    document.getElementById("stage-message").textContent = "规划耗时较长，请耐心等待…";
                    document.getElementById("soothing-text").textContent = "有时候好的行程需要更多思考 🤔";
                }
            }, 30000);
            stallFailTimer = setTimeout(() => {
                if (!done) {
                    evtSource.close();
                    showFail("LLM 响应超时（120 秒无响应），请重试");
                }
            }, 120000);
        }

        function showFail(msg) {
            done = true;
            document.getElementById("main-card").classList.add("hidden");
            document.getElementById("fail-message").textContent = msg;
            document.getElementById("fail-card").classList.remove("hidden");
        }

        function retryPlan() {
            const form = document.createElement("form");
            form.method = "POST";
            form.action = "/plan";
            form.innerHTML = `
                <input name="destination" value="${destination}">
                <input name="days" value="${days}">
                <input name="budget" value="${budget}">
                <input name="interests" value="${interests}">
            `;
            document.body.appendChild(form);
            form.submit();
        }

        const evtSource = new EventSource("/plan/" + planId + "/progress");

        evtSource.onmessage = function(e) {
            const data = JSON.parse(e.data);

            if (data.failed) {
                clearTimeout(stallWarnTimer);
                clearTimeout(stallFailTimer);
                showFail(data.error || "规划出错，请重试");
                return;
            }

            if (data.done) {
                if (done) return;
                done = true;
                clearTimeout(stallWarnTimer);
                clearTimeout(stallFailTimer);
                evtSource.close();

                document.getElementById("main-card").classList.add("hidden");
                document.getElementById("done-card").classList.remove("hidden");

                setTimeout(() => {
                    window.location.href = "/plan/" + data.plan_id;
                }, 2500);
                return;
            }

            if (done) return;

            // 有进度更新，重置空闲计时器（LLM 还在工作）
            resetStallTimers();

            const s = stages[data.stage] || { icon: "⏳", label: data.stage };

            document.getElementById("progress-bar").style.width = data.pct + "%";
            document.getElementById("stage-icon").textContent = s.icon;
            document.getElementById("stage-message").textContent = data.message;

            document.getElementById("soothing-text").textContent =
                soothing[soothingIdx % soothing.length];
            soothingIdx++;

            const log = document.createElement("div");
            log.className = "flex items-center gap-2 text-sm text-gray-600 bg-gray-50 rounded-lg px-3 py-2";
            log.innerHTML = `<span>${s.icon}</span> <span>${data.message}</span>`;
            logContainer.appendChild(log);
            logContainer.scrollTop = logContainer.scrollHeight;
        };

        // 如果 5 秒后还没收到任何进度事件，开始轮播安慰话术
        setTimeout(() => {
            if (!done && soothingIdx === 0) {
                document.getElementById("soothing-text").textContent =
                    soothing[++soothingIdx % soothing.length];
            }
        }, 5000);

        evtSource.onerror = function() {
            if (!done) {
                document.getElementById("stage-message").textContent = "连接中断，正在重试…";
                document.getElementById("soothing-text").textContent = "别担心，你的规划进度已保存 💾";
            }
        };
    </script>
</body>
</html>
