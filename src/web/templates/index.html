{% extends "base.html" %}
{% block title %}旅游助手 - 输入需求{% endblock %}
{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-blue-100 p-8 mt-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">规划你的旅行 ✈️</h1>
        <p class="text-gray-500 text-sm mb-6">填写下方信息，多位 AI 旅行专家将为你协作定制行程</p>

        <form action="/plan" method="post" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">目的地</label>
                <input type="text" name="destination" required
                       class="w-full rounded-lg border border-gray-300 px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                       placeholder="例如：云南大理">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">天数</label>
                    <input type="number" name="days" min="1" max="30" value="3" required
                           class="w-full rounded-lg border border-gray-300 px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">预算 (CNY)</label>
                    <input type="number" name="budget" min="0" step="100" value="3000" required
                           class="w-full rounded-lg border border-gray-300 px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">偏好 / 备注</label>
                <textarea name="interests" rows="3"
                          class="w-full rounded-lg border border-gray-300 px-4 py-2.5 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition"
                          placeholder="例如：喜欢美食、自然风光，不想太累"></textarea>
            </div>

            <button type="submit"
                    class="w-full bg-gradient-to-r from-blue-500 to-blue-600 text-white py-3 px-6 rounded-lg font-medium hover:from-blue-600 hover:to-blue-700 transition shadow-md">
                开始规划 →
            </button>
        </form>

        {% if error %}
        <div class="mt-6 p-4 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">{{ error }}</div>
        {% endif %}
    </div>

    <div class="mt-6 grid grid-cols-4 gap-3 text-center text-xs text-gray-400">
        <div class="p-3">🌏 导游规划路线</div>
        <div class="p-3">🍜 美食家推荐</div>
        <div class="p-3">🏘️ 本地通贴士</div>
        <div class="p-3">💰 财务官管账</div>
    </div>
</div>
{% endblock %}
