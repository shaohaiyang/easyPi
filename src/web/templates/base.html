<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}旅游助手{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
    .markdown-content h2 { font-size: 1.125rem; font-weight: 700; color: #1f2937; margin-top: 1rem; margin-bottom: 0.5rem; }
    .markdown-content h3 { font-size: 1rem; font-weight: 600; color: #374151; margin-top: 0.75rem; margin-bottom: 0.375rem; }
    .markdown-content p { margin-bottom: 0.5rem; line-height: 1.7; }
    .markdown-content ul, .markdown-content ol { padding-left: 1.25rem; margin-bottom: 0.5rem; }
    .markdown-content li { margin-bottom: 0.25rem; list-style-type: disc; }
    .markdown-content strong { font-weight: 600; color: #111827; }
    .markdown-content hr { margin: 1rem 0; border-color: #e5e7eb; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="/" class="text-xl font-bold text-blue-600">🌍 旅游助手</a>
            <span class="text-sm text-gray-400">多智能体协作</span>
        </div>
    </nav>
    <main class="max-w-6xl mx-auto px-6 py-8">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
